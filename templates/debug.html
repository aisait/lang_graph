<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVI CLI Debugger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #00ff99;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        #header {
            border-bottom: 1px solid #00ff99;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            color: #00cc88;
        }
        #header .title { font-size: 1.2rem; font-weight: bold; }
        #header .status { font-size: 0.8rem; color: #66ffaa; }
        #output {
            flex: 1;
            overflow-y: auto;
            background-color: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.6;
            min-height: 0;
            margin-bottom: 20px;
        }
        #output .system { color: #66aaff; }
        #output .user { color: #ffcc00; font-weight: bold; }
        #output .assistant { color: #00ff99; }
        #output .error { color: #ff4444; background: #331111; padding: 2px 6px; border-radius: 4px; }
        #output .context { color: #8888ff; font-style: italic; border-top: 1px solid #333; margin-top: 8px; padding-top: 8px; }
        #output .raw { color: #aa66ff; font-size: 0.8rem; }
        #input-area {
            display: flex;
            gap: 10px;
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }
        #input-area input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00ff99;
            padding: 12px 20px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        #input-area input:focus { border-color: #00ff99; }
        #input-area button {
            background: #00ff99;
            color: #0a0a0a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        #input-area button:hover { background: #66ffaa; }
        #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .log-line { padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
        .separator { border: none; border-top: 1px dashed #2a4a2a; margin: 6px 0; }
    </style>
</head>
<body>
    <div id="header">
        <span class="title">⚡ JARVI · DEBUG CONSOLE</span>
        <span class="status" id="status">🟢 Conectado a: <span id="backend-url">{{ backend_url }}</span></span>
    </div>
    <div id="output">
        <div class="system">[Sistema] Consola de depuración iniciada.</div>
        <div class="system">[Sistema] Escribe tu mensaje y presiona Enter.</div>
        <div class="system" id="thread-display">[Sistema] Thread ID: <span id="thread-id">(cargando...)</span></div>
        <hr class="separator">
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje de depuración..." autofocus>
        <button id="send-btn">Enviar</button>
    </div>
    <script>
        (function() {
            const output = document.getElementById('output');
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const threadDisplay = document.getElementById('thread-id');

            let currentThreadId = null;
            function getThreadId() {
                let tid = localStorage.getItem('debug_thread_id');
                if (!tid) {
                    tid = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2);
                    localStorage.setItem('debug_thread_id', tid);
                }
                return tid;
            }
            currentThreadId = getThreadId();
            threadDisplay.textContent = currentThreadId;

            let currentAssistantMessage = '';
            let assistantDiv = null;
            let tokenBuffer = '';

            function appendLog(text, type = 'assistant') {
                const div = document.createElement('div');
                div.className = `log-line ${type}`;
                div.textContent = text;
                output.appendChild(div);
                output.scrollTop = output.scrollHeight;
                return div;
            }

            function appendUserMessage(text) {
                appendLog(`> ${text}`, 'user');
            }

            function startAssistantMessage() {
                currentAssistantMessage = '';
                assistantDiv = document.createElement('div');
                assistantDiv.className = 'log-line assistant';
                assistantDiv.id = 'assistant-current';
                assistantDiv.textContent = '▌';
                output.appendChild(assistantDiv);
                output.scrollTop = output.scrollHeight;
            }

            function appendToken(token) {
                if (!assistantDiv) {
                    startAssistantMessage();
                }
                currentAssistantMessage += token;
                assistantDiv.textContent = currentAssistantMessage + '▌';
                output.scrollTop = output.scrollHeight;
            }

            function finishAssistantMessage(contexto = null) {
                if (assistantDiv) {
                    assistantDiv.textContent = currentAssistantMessage;
                    assistantDiv.id = '';
                    assistantDiv = null;
                }
                if (contexto && Object.keys(contexto).length > 0) {
                    const ctxDiv = document.createElement('div');
                    ctxDiv.className = 'log-line context';
                    ctxDiv.textContent = `[CONTEXTO] ${JSON.stringify(contexto, null, 2)}`;
                    output.appendChild(ctxDiv);
                    output.scrollTop = output.scrollHeight;
                }
                currentAssistantMessage = '';
            }

            async function sendMessage() {
                const message = input.value.trim();
                if (!message) return;

                appendUserMessage(message);
                input.value = '';
                input.disabled = true;
                sendBtn.disabled = true;

                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'log-line assistant';
                loadingDiv.textContent = '...';
                loadingDiv.id = 'loading-indicator';
                output.appendChild(loadingDiv);
                output.scrollTop = output.scrollHeight;

                try {
                    const response = await fetch('/api/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ thread_id: currentThreadId, message: message })
                    });

                    const loader = document.getElementById('loading-indicator');
                    if (loader) loader.remove();

                    if (!response.ok) {
                        const errText = await response.text();
                        appendLog(`[ERROR] HTTP ${response.status}: ${errText}`, 'error');
                        return;
                    }

                    startAssistantMessage();
                    let contexto = {};

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        let lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (let line of lines) {
                            line = line.trim();
                            if (!line || !line.startsWith('data: ')) continue;

                            const jsonStr = line.slice(6);
                            try {
                                const data = JSON.parse(jsonStr);
                                if (data.token !== undefined) {
                                    appendToken(data.token);
                                } else if (data.info) {
                                    appendLog(`[INFO] ${data.info}`, 'system');
                                } else if (data.error) {
                                    appendLog(`[ERROR] ${data.error}`, 'error');
                                } else if (data.contexto_tecnico) {
                                    contexto = data.contexto_tecnico;
                                    finishAssistantMessage(contexto);
                                } else {
                                    // Mostrar cualquier otro evento como raw
                                    appendLog(`[RAW] ${jsonStr}`, 'raw');
                                }
                            } catch (e) {
                                // Si falla el parseo, mostrar el evento crudo
                                appendLog(`[EVENT] ${jsonStr}`, 'raw');
                            }
                        }
                    }

                    if (currentAssistantMessage) {
                        finishAssistantMessage();
                    }

                } catch (error) {
                    const loader = document.getElementById('loading-indicator');
                    if (loader) loader.remove();
                    appendLog(`[EXCEPCIÓN] ${error.message}`, 'error');
                } finally {
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.focus();
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            input.focus();
            console.log('Debug CLI cargado. Thread ID:', currentThreadId);
        })();
    </script>
</body>
</html>
